<template>
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby={headerTitleId}
            aria-describedby={modalContentId} class={computedModalClass}>
            <div class="slds-modal__container">
                <template if:false={hideCloseButton}>
                    <lightning-button-icon
                        class="slds-modal__close"
                        icon-name="utility:close"
                        variant="bare-inverse"
                        size="large"
                        title={closeButtonTitle}
                        alternative-text={closeButtonTitle}
                        onclick={handleClose}>
                    </lightning-button-icon>
                </template>

                <template if:false={hideHeader}>
                    <header class={computedHeaderClass}>
                        <slot name="header">
                            <template if:true={title}>
                                <h2 id={headerTitleId} class="slds-modal__title slds-hyphenate">{title}</h2>
                            </template>
                            <template if:true={tagline}>
                                <p class="slds-m-top_x-small">{tagline}</p>
                            </template>
                        </slot>
                    </header>
                </template>

                <div id={modalContentId} class="slds-modal__content slds-p-around_medium">
                    <slot></slot>
                </div>

                <template if:false={hideFooter}>
                    <footer class="slds-modal__footer">
                        <slot name="footer">
                            <button class="slds-button slds-button_neutral" onclick={handleClose}>
                                {cancelButtonLabel}
                            </button>
                        </slot>
                    </footer>
                </template>
            </div>
        </section>
        <div class={computedBackdropClass} role="presentation"></div>
    </template>
</template>
