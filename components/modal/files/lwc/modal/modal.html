<template>
    <template if:true={isOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby={headerTitleId}
            aria-describedby={modalContentId}
            class={computedModalClass}>
            <div class="slds-modal__container">
                <template if:false={hideCloseButton}>
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title={closeButtonTitle}
                        onclick={handleClose}>
                        <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true" viewBox="0 0 52 52">
                            <path d="M31 25.4l13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2 13.7 8.1c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1L9.5 38.5c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0l13.1-13.1 13.1 13.1c.6.6 1.5.6 2.1 0l2.1-2.1c.6-.6.6-1.5 0-2.1L31 25.4z" fill="currentColor"/>
                        </svg>
                        <span class="slds-assistive-text">{closeButtonTitle}</span>
                    </button>
                </template>

                <template if:false={hideHeader}>
                    <header class={computedHeaderClass}>
                        <slot name="header">
                            <template if:true={title}>
                                <h2 id={headerTitleId} class="slds-modal__title slds-hyphenate">{title}</h2>
                            </template>
                            <template if:true={tagline}>
                                <p class="slds-m-top_x-small">{tagline}</p>
                            </template>
                        </slot>
                    </header>
                </template>

                <div id={modalContentId} class="slds-modal__content slds-p-around_medium">
                    <slot></slot>
                </div>

                <template if:false={hideFooter}>
                    <footer class="slds-modal__footer">
                        <slot name="footer">
                            <button class="slds-button slds-button_neutral" onclick={handleClose}>
                                {cancelButtonLabel}
                            </button>
                        </slot>
                    </footer>
                </template>
            </div>
        </section>
        <div class={computedBackdropClass} role="presentation"></div>
    </template>
</template>
